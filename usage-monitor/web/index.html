<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Usage Monitor</title>
    <script>
      // The mode MUI stores is read here, before first paint: MUI itself only sets data-light once the bundle has loaded.
      try {
        if (localStorage.getItem('mui-mode') === 'light') document.documentElement.setAttribute('data-light', '');
      } catch (e) {}
    </script>
    <style>
      /* First paint, before the bundle runs: dark by default (matches background.default in theme.ts), light only when the script above saw the stored choice. */
      html:not([data-light]) {
        color-scheme: dark;
        background: #111113;
      }
      html[data-light] {
        color-scheme: light;
        background: #fcfcfd;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='8' width='3' height='6' rx='1' fill='%2306b6d4'/%3E%3Crect x='6.5' y='4' width='3' height='10' rx='1' fill='%2306b6d4'/%3E%3Crect x='11' y='1.5' width='3' height='12.5' rx='1' fill='%2306b6d4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
